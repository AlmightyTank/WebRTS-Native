name: Native Godot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  godot-smoke:
    name: Headless import and native menu smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project and parse scenes
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource" /tmp/godot-import.log; then exit 1; fi
      - name: Native menu smoke tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 180 res://tests/smoke.tscn 2>&1 | tee /tmp/godot-smoke.log
          grep -q "PASS: native Godot main menu boot" /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource" /tmp/godot-smoke.log; then exit 1; fi
      - name: Scene navigation and state lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 180 res://tests/architecture.tscn 2>&1 | tee /tmp/godot-architecture.log
          grep -q "PASS: architecture navigation state lifecycle" /tmp/godot-architecture.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource" /tmp/godot-architecture.log; then exit 1; fi
      - name: Keyboard mouse and touch menu input
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 240 res://tests/menu_input.tscn 2>&1 | tee /tmp/godot-menu-input.log
          grep -q "PASS: native main menu keyboard mouse touch input" /tmp/godot-menu-input.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|FAIL:" /tmp/godot-menu-input.log; then exit 1; fi
      - name: Normal game startup smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/godot-boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource" /tmp/godot-boot.log; then exit 1; fi

  windows-smoke:
    name: Windows editor startup and menu smoke
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Windows Godot 4.7.2
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $engine = Get-ChildItem -Path $destination -Filter '*win64.exe' -File | Select-Object -First 1
          if (-not $engine) { throw 'Godot 4.7.2 Windows executable missing' }
          "GODOT_EXE=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $engine.FullName --version
      - name: Native project import
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path . --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows scene and interaction smoke
        shell: pwsh
        run: |
          $output = & $env:GODOT_EXE --headless --path . --quit-after 180 res://tests/smoke.tscn 2>&1
          $output | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output | Select-String -Pattern 'SCRIPT ERROR|Parse Error|Failed loading resource') { exit 1 }
          if (-not ($output | Select-String -Pattern 'PASS: native Godot main menu boot')) { exit 1 }
      - name: Windows mouse keyboard and touch menu input
        shell: pwsh
        run: |
          $output = & $env:GODOT_EXE --headless --path . --quit-after 240 res://tests/menu_input.tscn 2>&1
          $output | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output | Select-String -Pattern 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL:') { exit 1 }
          if (-not ($output | Select-String -Pattern 'PASS: native main menu keyboard mouse touch input')) { exit 1 }
      - name: Windows architecture lifecycle tests
        shell: pwsh
        run: |
          $output = & $env:GODOT_EXE --headless --path . --quit-after 180 res://tests/architecture.tscn 2>&1
          $output | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output | Select-String -Pattern 'SCRIPT ERROR|Parse Error|Failed loading resource') { exit 1 }
          if (-not ($output | Select-String -Pattern 'PASS: architecture navigation state lifecycle')) { exit 1 }
